<app-navbar></app-navbar>
<section class="experience-section">
  <div class="container">
    <h1 class="section-title">Work Experience</h1>
    <p class="section-subtitle">My professional journey and accomplishments</p>
    
    <div class="timeline">
      <div class="experience-item" *ngFor="let exp of experiences; let i = index">
        <div class="timeline-marker"></div>
        <div class="experience-content">
          <div class="experience-header">
            <h2>{{ exp.position }}</h2>
            <span class="duration">{{ exp.duration }}</span>
          </div>
          <h3 class="company">{{ exp.company }}</h3>
          <p class="description">{{ exp.description }}</p>
          <ul class="responsibilities">
            <li *ngFor="let responsibility of exp.responsibilities">
              {{ responsibility }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
