<app-navbar></app-navbar>
<section class="skills-section">
  <div class="container">
    <h1 class="section-title">Technical Skills</h1>
    
    <div class="skills-grid">
      <div class="skill-category">
        <h2>Backend Development</h2>
        <div class="skills-list">
          <div class="skill-item" *ngFor="let skill of getSkillsByCategory('Backend')">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="skill-category">
        <h2>Frontend Development</h2>
        <div class="skills-list">
          <div class="skill-item" *ngFor="let skill of getSkillsByCategory('Frontend')">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="skill-category">
        <h2>Database</h2>
        <div class="skills-list">
          <div class="skill-item" *ngFor="let skill of getSkillsByCategory('Database')">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="skill-category">
        <h2>Tools & Others</h2>
        <div class="skills-list">
          <div class="skill-item" *ngFor="let skill of getSkillsByCategory('Tools')">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
